# groundworkers example config — oa-configurator 1.x StackConfig format
#
# Copy to groundworkers.local.toml and fill in your values.
# Full reference: https://oa-configurator.readthedocs.io (or run omop-config --help)
#
# The shape is: physical [connections.*] and [providers.*] carry credentials,
# logical [databases.*], [models.*], and [vector_stores.*] give them names and
# roles, and [tools.groundworkers] references those names. Groundworkers reads
# only its own section plus the entries it names.

# ---------------------------------------------------------------------------
# Connections — physical servers and credentials
# ---------------------------------------------------------------------------

[connections.cdm_main]
dialect       = "postgresql+psycopg"
host          = "localhost"
port          = 5432
user          = "readonly"
password      = "readonly"
database_name = "cava"

# pgvector embedding store — only needed for the pgvector backend below
# [connections.emb_main]
# dialect       = "postgresql+psycopg"
# host          = "localhost"
# port          = 5432
# user          = "emb"
# password      = "emb"
# database_name = "omop_emb"

# ---------------------------------------------------------------------------
# Databases — logical roles over those connections
# ---------------------------------------------------------------------------

# kind = "cdm" bundles the CDM, vocabulary, and results roles. vocab_connection
# and vocab_schema fall back to the primary connection and schema when unset.
[databases.cdm_db]
kind         = "cdm"
connection   = "cdm_main"
schema_name  = "public"
vocab_schema = "public"

# The embedding store's database. kind = "generic": no CDM role-splitting.
[databases.emb_db]
kind          = "generic"
connection    = "cdm_main"
schema_name   = "public"

# ---------------------------------------------------------------------------
# Providers and models — endpoints, then the named models served through them
# ---------------------------------------------------------------------------

[providers.local_ollama]
provider = "ollama"
base_url = "http://localhost:11434/v1"
api_key  = "ollama"

# Embedding model, referenced by embedding_model_name below.
[models.embedding_model]
provider   = "local_ollama"
model      = "bge-small-en-v1.5"
embeddings = true

# Chat model, referenced by llm_model_name below. A separate entry from the
# embedding model, and free to sit on a different provider. Capabilities are
# opt-in: declare structured_output so the JSON-mode tool path is available.
# [models.chat_model]
# provider          = "local_ollama"
# model             = "qwen3:8b"
# structured_output = true

# ---------------------------------------------------------------------------
# Vector store — where embeddings are stored
# ---------------------------------------------------------------------------

# Supported backend_type values are "sqlitevec" and "pgvector". faiss_cache_dir
# is an optional query-time cache layered over either (install the
# "embedding-faiss" extra to use it) — FAISS is not itself a backend value.
[vector_stores.embeddings]
backend_type    = "sqlitevec"
database        = "emb_db"
faiss_cache_dir = "/absolute/path/to/omop_emb-cache"

# ---------------------------------------------------------------------------
# Groundworkers — which of the above entries to use, plus its own settings
# ---------------------------------------------------------------------------

[tools.groundworkers]
app_name             = "groundworkers"
cdm_db               = "cdm_db"
# A CDM-only stack is valid: drop the three lines below and every lexical
# feature still works.
embedding_model_name = "embedding_model"
vector_store_name    = "embeddings"
# llm_model_name     = "chat_model"   # enables text, domain, and LLM-assisted
                                      # source planning. No separate on/off flag.

# MCP transport (stdio is the default for Claude Code; streamable-http for HTTP clients)
[tools.groundworkers.mcp]
transport = "stdio"
# host = "127.0.0.1"
# port = 8000

# REST API (enables HTTP access alongside MCP stdio, e.g. for study-agent-mcp)
[tools.groundworkers.rest]
enabled = false
# host      = "127.0.0.1"
# port      = 18080
# base_path = "/v1"

# Grounding behaviour
[tools.groundworkers.grounding]
min_fulltext_overlap = 0.0    # 0.0-1.0; raise to tighten FTS result acceptance
max_depth            = 5      # 1-10 hierarchy hops

[tools.groundworkers.source_planning]
llm_assisted_enabled = true   # no effect unless llm_model_name is set
