name: CI
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]
jobs:
  label-gate:
    uses: AustralianCancerDataNetwork/cava-devops/.github/workflows/label-gate.yml@main
  build-test:
    uses: AustralianCancerDataNetwork/cava-devops/.github/workflows/build-test.yml@main
  build-test-postgres:
    uses: AustralianCancerDataNetwork/cava-devops/.github/workflows/build-test-postgres.yml@main
    with:
      ty-src: src
      postgres-image: pgvector/pgvector:pg18
      postgres-db: test_db
      postgres-user: postgres
      postgres-password: postgres
      setup-commands: |
        mkdir -p "$RUNNER_TEMP/omop"
        cp tests/support/postgres_ci_config.toml "$RUNNER_TEMP/omop/config.toml"
        export OA_CONFIG_PATH="$RUNNER_TEMP/omop/config.toml"
        export GROUNDWORKERS_CONFIG_PATH="$RUNNER_TEMP/omop/config.toml"
        export GROUNDWORKERS_REQUIRE_INTEGRATION=1
        export GROUNDWORKERS_TEST_DATABASE_URL="postgresql+psycopg://postgres:postgres@localhost:5432/test_db"
        echo "OA_CONFIG_PATH=$RUNNER_TEMP/omop/config.toml" >> "$GITHUB_ENV"
        echo "GROUNDWORKERS_CONFIG_PATH=$RUNNER_TEMP/omop/config.toml" >> "$GITHUB_ENV"
        echo "GROUNDWORKERS_REQUIRE_INTEGRATION=1" >> "$GITHUB_ENV"
        echo "GROUNDWORKERS_TEST_DATABASE_URL=postgresql+psycopg://postgres:postgres@localhost:5432/test_db" >> "$GITHUB_ENV"
        uv run omop-config connections add pg_test \
          --dialect postgresql+psycopg \
          --host localhost \
          --port 5432 \
          --user postgres \
          --password postgres \
          --database-name test_db \
          --test-only false
        uv run omop-config databases add cdm test_cdm_db --connection pg_test --cdm-schema gw_primary --vocab-schema gw_vocab
        uv run omop-config databases add generic test_vector_db --connection pg_test --schema-name embeddings
        uv run omop-config vector-stores add test_embeddings \
          --backend-type pgvector \
          --database test_vector_db
        uv run omop-config configure groundworkers \
          --cdm-db test_cdm_db \
          --vector-store-name test_embeddings
        uv run python -m tests.support.seed_postgres_fixture
  test-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - name: Run hermetic suite with coverage and skip reasons
        run: |
          uv sync --frozen --all-extras --dev
          export GROUNDWORKERS_REQUIRE_FORMAT_TESTS=1
          echo "GROUNDWORKERS_REQUIRE_FORMAT_TESTS=1" >> "$GITHUB_ENV"
          COVERAGE_FILE="$RUNNER_TEMP/groundworkers.coverage" uv run pytest -q -ra \
            --cov=groundworkers --cov-branch \
            --cov-report=xml:"$RUNNER_TEMP/coverage.xml" \
            --junitxml="$RUNNER_TEMP/pytest.xml"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: groundworkers-test-evidence
          path: |
            ${{ runner.temp }}/coverage.xml
            ${{ runner.temp }}/pytest.xml
          if-no-files-found: warn
  wheel-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - name: Build and smoke-test base and optional wheel installs
        run: |
          uv build --wheel
          wheel="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          wheel="$(pwd)/$wheel"
          uv venv "$RUNNER_TEMP/gw-wheel-base" --python 3.12
          uv pip install --python "$RUNNER_TEMP/gw-wheel-base/bin/python" "$wheel"
          mkdir -p "$RUNNER_TEMP/gw-wheel-run"
          cd "$RUNNER_TEMP/gw-wheel-run"
          "$RUNNER_TEMP/gw-wheel-base/bin/python" "$GITHUB_WORKSPACE/tests/support/wheel_smoke.py" base
          uv venv "$RUNNER_TEMP/gw-wheel-extras" --python 3.12
          uv pip install --python "$RUNNER_TEMP/gw-wheel-extras/bin/python" "$wheel[all_source,tui]" httpx
          "$RUNNER_TEMP/gw-wheel-extras/bin/python" "$GITHUB_WORKSPACE/tests/support/wheel_smoke.py" extras
