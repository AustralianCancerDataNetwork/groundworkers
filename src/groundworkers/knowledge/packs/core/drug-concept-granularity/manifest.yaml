name: drug-concept-granularity
layer: core
version: "2.3"
shareability: public
scope_summary: >
  Choosing a Drug concept level by comparing source and candidate attributes,
  with no fixed class or vocabulary ranking. Records the result as an SSSOM
  predicate or as unresolved, lists lost or added detail, and keeps review
  separate; narrowMatch and closeMatch always go to human review. Snapshot examples are optional reference evidence.

mechanisms:
  - context-inject

applicability:
  always: false
  domains:
    - Drug

see_also:
  - standard-concept-preference
  - domain-routing
