# Agent reference data; Groundworkers does not execute these fields.
# Class criteria are an unordered, non-exhaustive RxNorm-family reference.
# Ingredient identity is implicit throughout; inspect every candidate's full definition.
# A criterion is not sufficient evidence of equivalence or active standard status.

attribute_definitions:
  ingredient: Ingredient identity, with salt/ester and active-moiety evidence where relevant.
  strength: Product amount, concentration or delivery rate with numerator, denominator, units and substance basis; not administered dose.
  dose_form: Formulation including stated release characteristics; not route alone.
  product_quantity: Total product amount or size with its unit and meaning; not automatically the denominator of a concentration or delivery rate.
  pack_composition: Component products and their counts; not total dispensing quantity.
  packaging_count: Count at the stated packaging level, distinguished from product quantity and dispensing quantity.
  brand: Verified proprietary identity; not inferred from supplier or a familiar product.
  supplier: Stated or verified supplier/manufacturer identity; does not supply missing product attributes.

concept_class_criteria:
  Branded Drug:
    defining_attributes: [strength, dose_form, brand]
  Branded Drug Box:
    defining_attributes: [strength, dose_form, packaging_count, brand]
  Branded Drug Comp:
    defining_attributes: [strength, brand]
  Branded Drug Form:
    defining_attributes: [dose_form, brand]
  Branded Pack:
    defining_attributes: [pack_composition, brand]
  Branded Pack Box:
    defining_attributes: [pack_composition, packaging_count, brand]
  Clinical Drug:
    defining_attributes: [strength, dose_form]
  Clinical Drug Box:
    defining_attributes: [strength, dose_form, packaging_count]
  Clinical Drug Comp:
    defining_attributes: [strength]
  Clinical Drug Form:
    defining_attributes: [dose_form]
  Clinical Pack:
    defining_attributes: [pack_composition]
  Clinical Pack Box:
    defining_attributes: [pack_composition, packaging_count]
  Ingredient:
    defining_attributes: []
  Marketed Product:
    defining_attributes: [strength, dose_form, supplier]
  Quant Branded Box:
    defining_attributes: [strength, dose_form, product_quantity, packaging_count, brand]
  Quant Branded Drug:
    defining_attributes: [strength, dose_form, product_quantity, brand]
  Quant Clinical Box:
    defining_attributes: [strength, dose_form, product_quantity, packaging_count]
  Quant Clinical Drug:
    defining_attributes: [strength, dose_form, product_quantity]

sources:
  - https://ohdsi.github.io/CommonDataModel/cdm55.html#drug_exposure
  - https://github.com/OHDSI/Vocabulary-v5.0/wiki/Vocab.-RXNORM_EXTENSION
