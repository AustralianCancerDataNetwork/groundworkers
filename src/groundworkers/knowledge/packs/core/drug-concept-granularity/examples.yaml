reasoning_scenarios:
- case: Brand, strength, form, box size and supplier stated; matching Marketed Product verified
  candidate_concept_id: 1830620
  predicate_id: skos:exactMatch
  review_decision: Apply the caller policy.
- case: Brand stated; no matching branded target verified
  candidate: A verified corresponding unbranded clinical drug
  predicate_id: skos:broadMatch
  lost_attributes:
  - brand
  review_decision: Apply the caller policy; pending if none is supplied. No branded candidate does not make
    the match exact.
- case: Box of 200 stated; only the corresponding unpackaged product verified
  candidate_concept_id: 40163554
  predicate_id: skos:broadMatch
  lost_attributes:
  - packaging_count
  review_decision: Apply the caller policy; pending if none is supplied.
- case: Concentration 8 mg/mL without container size
  supported: Concentration only
  unsupported: A 1 mL container or total product quantity inferred from the denominator
- case: Inhaler strength per actuation; total actuations unspecified
  supported: Strength per actuation
  unsupported: Total product quantity inferred from the strength denominator
- case: Patch delivery rate with no total product amount
  supported: Delivery rate and stated time unit
  unsupported: An inferred total amount or automatic quantified-class selection
- case: Base ingredient named; target names a salt or ester
  predicate_id: null
  resolution: Establish an exact match from evidence, or verify a source-supported broader target such as
    the base Ingredient.
  evidence_needed: Source mapping or vocabulary evidence for the ingredient identity and strength basis;
    one warfarin example is insufficient.
- case: Supplier known; brand or packaging count missing
  unsupported: Filling missing brand or packaging count from supplier alone
- case: Blank source label with no other identifying drug information
  object_id: sssom:NoTermFound
candidate_use: Verify source attributes, candidate definition and current eligibility before deciding.
