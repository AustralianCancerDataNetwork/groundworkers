# Standard concept eligibility rules and provisional domain preferences.
# These rules are currently declarative; see guidance.md for the resolution policy.

active_concept_required:
  # Concepts must be active — not deprecated or replaced.
  reject_if_any:
    - invalid_reason IS NOT NULL
    - valid_end_date != '2099-12-31'
  note: >
    For replaced concepts (invalid_reason = 'U'), follow the 'Maps to' relationship
    from the deprecated concept to its active successor.

standard_concept_required:
  # Entity concept fields must have standard_concept = 'S'.
  # standard_concept = 'C' (classification) and NULL are not valid targets.
  entity_fields:
    - condition_concept_id
    - measurement_concept_id
    - observation_concept_id
    - drug_concept_id
    - procedure_concept_id
    - device_concept_id
    - specimen_concept_id
  reject_if: standard_concept != 'S'

vocab_preference:
  - domain: Condition
    prefer: [SNOMED]
    over: [ICD10CM, ICD9CM, ICD10, MedDRA]
    note: >
      Tie-breaker only among active standard concepts representing the same
      meaning at the required specificity. ICDO3 also has standard Condition
      combinations; do not replace them automatically with SNOMED.

  - domain: Drug
    prefer: [RxNorm]
    over: [RxNorm Extension]
    note: >
      Prefer RxNorm clinical drug concepts. Use RxNorm Extension only when no
      RxNorm concept exists for the same clinical drug at the same precision level.

  - domain: Measurement
    note: >
      No blanket ranking. Choose based on whether the source represents a
      survey item, clinical assessment, finding, or score; verify the candidate
      domain and preserve the source representation.

  - domain: Procedure
    note: >
      No blanket ranking. Standard source concepts in CPT4, HCPCS, ICD10PCS,
      and ICD9Proc may map to themselves. Use SNOMED only when it is the
      appropriate representation, not as an automatic replacement.

  - domain: Observation
    note: >
      No blanket ranking. Distinguish survey items, observations, history
      patterns, and other recorded entities by their meaning and target field.
