[project]
name = "groundworkers"
version = "0.2.0"
description = "Groundworkers MCP server — read-only agentive access to OMOP vocabularies, concept graphs, and embeddings."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "mcp[cli]>=1,<2",
  "pydantic>=2,<3",
  "pyyaml>=6,<7",
  "SQLAlchemy>=2,<3",
  "psycopg[binary]>=3.1,<4",
  "omop-graph>=1.1.1",
  "omop-emb>=1.0.0",
]

[project.optional-dependencies]
llm = [
  "openai>=1.0",
]
xlsx = [
  "openpyxl>=3.1,<4",
]
pdf = [
  "pdfplumber>=0.10",
]
docx = [
  "python-docx>=1.0",
]
all_source = [
  "openpyxl>=3.1,<4",
  "pdfplumber>=0.10",
  "python-docx>=1.0",
]
embedding-pgvector = [
  "omop-emb[pgvector]>=1.0.0",
]
embedding-faiss = [
  "omop-emb[faiss-cpu]>=1.0.0",
]
dev = [
  "ipython>=8.0",
  "tornado>=6.5.5",
  "pytest>=9.0.3",
  "pytest-cov>=4.0",
  "mypy>=1.8",
  "ruff>=0.4",
  "mkdocs-material>=9.7.1",
  "mkdocstrings-python>=2.0.1",
  "mkdocs>=1.6.1",
  "requests>=2.33.0",
  "mkdocs-mermaid2-plugin"
]

[project.scripts]
groundworkers = "groundworkers.server:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: requires a live backend or database",
  "requires_client: requires an embedding API client",
]
