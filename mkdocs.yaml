site_name: groundworkers
site_description: Read-only OMOP tooling for MCP and direct Python services
site_url: https://AustralianCancerDataNetwork.github.io/groundworkers
repo_url: https://github.com/AustralianCancerDataNetwork/groundworkers
repo_name: groundworkers

theme:
  name: material
  features:
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    - content.code.copy
    - content.code.annotate
  palette:
    - scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: light-blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - Understand Groundworkers:
      - Concepts and capability choices: concepts.md
  - Getting Started:
      - Installation: usage/installation.md
      - Initial local setup: from-scratch.md
      - Setup journey: usage/setup_journey.md
      - Configuration: usage/configuration.md
      - Integrations: usage/integrations.md
  - Tools:
      - Overview: tools/overview.md
      - Concept Tools: tools/concept.md
      - Resolver Tools: tools/resolver.md
      - Search Tools: tools/search.md
      - Mapping Tools: tools/mapping.md
      - Embedding Tools: tools/embedding.md
      - Text Tools: tools/text.md
      - Domain Tools: tools/domain.md
      - Knowledge Tools: tools/knowledge.md
      - Source Planning Tools: tools/source_planning.md
      - System Tools: tools/system.md
      - Semantic Projection Tools: tools/semantic_projection.md
  - Services:
      - Graph Service: services/graph.md
      - Grounding Service: services/grounding.md
      - Vocab Service: services/vocab.md
      - Mapping Service: services/mapping.md
      - Source Planning Service: services/source_planning.md
      - Text Service: services/text.md
      - Domain Service: services/domain.md
      - Semantic Projection Service: services/semantic_projection.md
  - Development and architecture:
      - Architecture: architecture.md
      - Python integration details: development/integration.md
      - Extending groundworkers: development/extending.md
      - Testing: usage/testing.md
      - CDM adapter: adapters/cdm.md
      - OMOP graph adapter: adapters/omop_graph.md
      - OMOP embedding adapter: adapters/omop_emb.md
  - API Reference:
      - Tools: reference/ref_tools.md
      - Services: reference/ref_services.md
      - Adapters: reference/ref_adapters.md
      - Configuration: reference/ref_config.md
      - Base: reference/ref_base.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_root_heading: true
            show_source: false

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid
  - attr_list
  - tables
  - pymdownx.highlight

extra_javascript:
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js
  - js/mermaid-init.js
